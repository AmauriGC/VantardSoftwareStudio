# como le pusimos en sonar
sonar.projectKey=back-vss
sonar.projectName=back-vss
sonar.projectVersion=1.0

# Codigo fuente Python del proyecto
# En este repo los módulos viven en la raíz (apps Django + manage.py).
# Usar la raíz evita olvidarse de nuevas apps al agregarlas.
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Analizar solo archivos Python
sonar.inclusions=**/*.py

# Excluir artefactos no relevantes
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/env/**,**/*.pyc,**/node_modules/**,**/static/**,**/tests.py,**/tests/**,**/test_*.py

# Tests
# En este proyecto los tests conviven con el código (tests.py o carpetas tests/).
# Se los clasifica como tests para métricas/reportes.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/tests/**/*.py,**/test_*.py

sonar.coverage.exclusions=**/*