# como le pusimos en sonar
sonar.projectKey=front-vss
sonar.projectName=front-vss
sonar.projectVersion=1.0

# Codigo fuente del proyecto (relativo al directorio raiz donde se ejecuta el scanner)
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Analizar solo archivos JS/TS/Vue
sonar.inclusions=**/*.js,**/*.ts,**/*.vue,**/*.jsx,**/*.tsx

# Excluir artefactos no relevantes
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.*,**/*.spec.*,**/coverage/**

# Excluir datos mock del análisis de duplicación (repetición estructural inherente)
sonar.cpd.exclusions=**/data/mockData.js

# Tests
#sonar.tests=src
#sonar.test.inclusions=**/*.test.*,**/*.spec.*
